<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #1e1e1e;
      color: #eee;
    }
    h1 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 10px 0;
      opacity: 0.7;
    }
    button {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: none;
      border-radius: 8px;
      background: #2d2d2d;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #3a3a3a; }
    button:last-child { margin-bottom: 0; }
    .icon { font-size: 16px; }
  </style>
</head>
<body>
  <h1 data-i18n="popupTitle">Quick Screenshot</h1>
  <button id="full"><span class="icon">🖼️</span> <span data-i18n="btnFullPage">Full page</span></button>
  <button id="area"><span class="icon">✂️</span> <span data-i18n="btnArea">Select area</span></button>
  <script src="popup.js"></script>
</body>
</html>
